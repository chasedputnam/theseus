version: "3.9"

services:
  theseus:
    build: .
    ports:
      - "7000:7000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=7000
      - DATA_DIR=/app/data
      - AUTH_ENABLED=true
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - SEARXNG_INSTANCE=http://searxng:8080
    depends_on:
      chromadb:
        condition: service_healthy
      searxng:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  chromadb:
    image: chromadb/chroma:0.4.24
    ports:
      - "8100:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    ports:
      - "8091:80"
    volumes:
      - ./data/ntfy:/var/lib/ntfy
    restart: unless-stopped
