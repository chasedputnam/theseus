name: Feature Request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe what you'd like and why it would be useful.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where you ran into a limitation or gap.
      placeholder: "I often need to do X but currently have to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds or other approaches you've thought about?

  - type: dropdown
    id: area
    attributes:
      label: Which area does this relate to?
      options:
        - Chat / Agent
        - Deep Research
        - Compare
        - Documents
        - Memory / Skills
        - Email
        - Calendar
        - Notes / Tasks
        - Gallery / Image Editor
        - Cookbook / Model Serving
        - Web Search
        - MCP / Tool Integration
        - Authentication / Security
        - API / Webhooks
        - Performance
        - Docker / Deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links to related issues, or anything else helpful.
