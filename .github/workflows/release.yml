name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build cross-platform binaries
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Building version: $VERSION"
          LDFLAGS="-s -w -X main.version=${VERSION}"

          mkdir -p build

          # Linux amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "${LDFLAGS}" \
            -o build/theseus-linux-amd64 ./cmd/theseus

          # Linux arm64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "${LDFLAGS}" \
            -o build/theseus-linux-arm64 ./cmd/theseus

          # macOS amd64 (Intel)
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "${LDFLAGS}" \
            -o build/theseus-darwin-amd64 ./cmd/theseus

          # macOS arm64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "${LDFLAGS}" \
            -o build/theseus-darwin-arm64 ./cmd/theseus

          # Windows amd64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "${LDFLAGS}" \
            -o build/theseus-windows-amd64.exe ./cmd/theseus

          # Windows arm64
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "${LDFLAGS}" \
            -o build/theseus-windows-arm64.exe ./cmd/theseus

      - name: Package static assets
        run: |
          # Bundle static/ into a zip so users can download frontend + binary together
          cd build
          for bin in theseus-linux-amd64 theseus-linux-arm64 theseus-darwin-amd64 theseus-darwin-arm64; do
            mkdir -p pkg/${bin}
            cp ${bin} pkg/${bin}/theseus
            cp -r ../static pkg/${bin}/static
            cp ../.env.example pkg/${bin}/.env.example
            tar -czf ${bin}.tar.gz -C pkg/${bin} .
          done
          for bin in theseus-windows-amd64 theseus-windows-arm64; do
            mkdir -p pkg/${bin}
            cp ${bin}.exe pkg/${bin}/theseus.exe
            cp -r ../static pkg/${bin}/static
            cp ../.env.example pkg/${bin}/.env.example
            cd pkg/${bin} && zip -r ../../${bin}.zip . && cd ../..
          done

      - name: Generate checksums
        run: |
          cd build
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/theseus-linux-amd64.tar.gz
            build/theseus-linux-arm64.tar.gz
            build/theseus-darwin-amd64.tar.gz
            build/theseus-darwin-arm64.tar.gz
            build/theseus-windows-amd64.zip
            build/theseus-windows-arm64.zip
            build/checksums.txt
            docker-compose.yml
            .env.example
